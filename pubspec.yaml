name: leher_app
description: Lehrernotenberechnungs-App für Schulnoten-Verwaltung
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  drift: ^2.13.0
  sqlite3_flutter_libs: ^0.5.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^12.0.0

  # File handling
  file_picker: ^6.2.1
  share_plus: ^7.2.1
  path_provider: ^2.1.2

  # Utils
  intl: ^0.18.1
  uuid: ^4.3.3
  path: ^1.8.3

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code generation
  build_runner: ^2.4.8
  drift_dev: ^2.13.0
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
